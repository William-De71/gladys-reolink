<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Battery protection thresholds</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="40" font-size="15" font-weight="600" fill="#24292f">Battery and solar cameras: what is captured at each level</text>
  <text x="40" y="60" font-size="12" fill="#57606a">Default thresholds, all adjustable. Wired cameras are never throttled.</text>

  <!-- gauge: pct -> x = 80 + 7.2 pct -->
  <rect x="80" y="95" width="288" height="44" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <rect x="368" y="95" width="144" height="44" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <rect x="512" y="95" width="288" height="44" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>

  <text x="224" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#a40e26">No capture at all</text>
  <text x="440" y="116" text-anchor="middle" font-size="12" font-weight="600" fill="#7d4e00">On demand only</text>
  <text x="440" y="131" text-anchor="middle" font-size="11" fill="#7d4e00">widget, detection</text>
  <text x="656" y="122" text-anchor="middle" font-size="13" font-weight="600" fill="#116329">Automatic refresh (every 15 min)</text>

  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="80" y="157">0 %</text>
    <text x="368" y="157">40 %</text>
    <text x="512" y="157">60 %</text>
    <text x="656" y="157">80 %</text>
    <text x="800" y="157">100 %</text>
  </g>

  <!-- hysteresis -->
  <path d="M 500 175 C 500 215, 656 215, 656 180" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="578" y="232" text-anchor="middle" font-size="12" fill="#24292f">once paused below 60 %, it waits for 80 % on solar…</text>
  <text x="578" y="250" text-anchor="middle" font-size="12" fill="#24292f">…or resumes at once when put back on its charger</text>

  <text x="40" y="290" font-size="12" fill="#24292f">The battery level and the detections are always read: they cost almost nothing and tell when the camera has recharged.</text>
  <text x="40" y="310" font-size="12" fill="#24292f">Behind a Home Hub, a camera the hub reports as asleep is never woken by the automatic refresh.</text>
</svg>
