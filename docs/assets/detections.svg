<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>ONVIF events compared with periodic checks</title>
  <rect x="0" y="0" width="880" height="420" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="40" font-size="15" font-weight="600" fill="#24292f">Two people walk past a camera: what Gladys sees</text>

  <!-- grid: t (s) -> x = 140 + 17.5 t -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="140" y1="60" x2="140" y2="330"/>
    <line x1="227.5" y1="60" x2="227.5" y2="330"/>
    <line x1="315" y1="60" x2="315" y2="330"/>
    <line x1="402.5" y1="60" x2="402.5" y2="330"/>
    <line x1="490" y1="60" x2="490" y2="330"/>
    <line x1="577.5" y1="60" x2="577.5" y2="330"/>
    <line x1="665" y1="60" x2="665" y2="330"/>
    <line x1="752.5" y1="60" x2="752.5" y2="330"/>
    <line x1="840" y1="60" x2="840" y2="330"/>
  </g>

  <!-- Row 1: what happens -->
  <text x="40" y="104" font-size="13" font-weight="600" fill="#24292f">In front</text>
  <text x="40" y="120" font-size="13" font-weight="600" fill="#24292f">of the camera</text>
  <rect x="192.5" y="92" width="105" height="24" rx="5" fill="#d0d7de"/>
  <text x="245" y="109" text-anchor="middle" font-size="11" fill="#24292f">person 1</text>
  <rect x="490" y="92" width="227.5" height="24" rx="5" fill="#d0d7de"/>
  <text x="603.75" y="109" text-anchor="middle" font-size="11" fill="#24292f">person 2</text>

  <!-- Row 2: ONVIF -->
  <text x="40" y="184" font-size="13" font-weight="600" fill="#1a7f37">ONVIF</text>
  <text x="40" y="200" font-size="12" fill="#1a7f37">(wired cameras)</text>
  <rect x="199.5" y="172" width="103.25" height="24" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="497" y="172" width="225.75" height="24" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="251" y="215" text-anchor="middle" font-size="11" fill="#1a7f37">start and end, within a second</text>
  <text x="610" y="215" text-anchor="middle" font-size="11" fill="#1a7f37">start and end, within a second</text>

  <!-- Row 3: polling -->
  <text x="40" y="264" font-size="13" font-weight="600" fill="#9a6700">Checked every</text>
  <text x="40" y="280" font-size="13" font-weight="600" fill="#9a6700">15 s</text>
  <g fill="#9a6700">
    <circle cx="140" cy="264" r="5"/>
    <circle cx="402.5" cy="264" r="5"/>
    <circle cx="665" cy="264" r="5"/>
  </g>
  <line x1="140" y1="264" x2="840" y2="264" stroke="#d4a72c" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" font-weight="600" fill="#cf222e">missed: came and went</text>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#cf222e">between two checks</text>
  <rect x="665" y="252" width="175" height="24" rx="5" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="752.5" y="296" text-anchor="middle" font-size="11" fill="#9a6700">seen 10 s late, ends late too</text>

  <!-- axis -->
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="140" y="350">0 s</text>
    <text x="227.5" y="350">5</text>
    <text x="315" y="350">10</text>
    <text x="402.5" y="350">15</text>
    <text x="490" y="350">20</text>
    <text x="577.5" y="350">25</text>
    <text x="665" y="350">30</text>
    <text x="752.5" y="350">35</text>
    <text x="840" y="350">40 s</text>
  </g>

  <text x="440" y="388" text-anchor="middle" font-size="12" fill="#24292f">Each camera uses ONVIF when it can. If ONVIF stops answering, it falls back to checks by itself,</text>
  <text x="440" y="406" text-anchor="middle" font-size="12" fill="#24292f">and returns to ONVIF as soon as it recovers. Battery cameras and hub/NVR cameras are always checked.</text>
</svg>
