<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How the Reolink integration talks to your cameras</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="520" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Gladys -->
  <rect x="40" y="40" width="220" height="110" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="150" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#0a3069">Gladys</text>
  <text x="150" y="104" text-anchor="middle" font-size="12" fill="#24292f">dashboard, scenes,</text>
  <text x="150" y="122" text-anchor="middle" font-size="12" fill="#24292f">live view (rtsp-camera)</text>

  <!-- Integration -->
  <rect x="380" y="40" width="240" height="110" rx="10" fill="#fff8e6" stroke="#bf8700" stroke-width="1.5"/>
  <text x="500" y="80" text-anchor="middle" font-size="16" font-weight="600" fill="#6b4600">Reolink integration</text>
  <text x="500" y="104" text-anchor="middle" font-size="12" fill="#24292f">its own container,</text>
  <text x="500" y="122" text-anchor="middle" font-size="12" fill="#24292f">no account, no cloud</text>

  <!-- Gladys <-> integration -->
  <line x1="260" y1="95" x2="378" y2="95" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="319" y="82" text-anchor="middle" font-size="11" fill="#57606a">WebSocket</text>
  <text x="319" y="114" text-anchor="middle" font-size="11" fill="#57606a">+ host API</text>

  <!-- LAN band -->
  <rect x="20" y="215" width="840" height="285" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 5"/>
  <text x="40" y="240" font-size="12" font-weight="600" fill="#57606a">YOUR LOCAL NETWORK</text>

  <!-- Wired camera -->
  <rect x="60" y="300" width="250" height="150" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="185" y="332" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Wired camera</text>
  <text x="185" y="354" text-anchor="middle" font-size="12" fill="#57606a">RLC, Duo, doorbell PoE/Wi-Fi…</text>
  <text x="80" y="384" font-size="12" fill="#24292f">• HTTP API — image, commands</text>
  <text x="80" y="404" font-size="12" fill="#1a7f37">• ONVIF — pushes its detections</text>
  <text x="80" y="424" font-size="12" fill="#8250df">• RTSP — live video</text>

  <!-- Hub / NVR -->
  <rect x="440" y="290" width="390" height="180" rx="10" fill="#ffffff" stroke="#24292f" stroke-width="1.5"/>
  <text x="635" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">Home Hub or NVR</text>
  <text x="635" y="341" text-anchor="middle" font-size="12" fill="#57606a">one address, one session, one device per camera</text>
  <rect x="460" y="360" width="110" height="90" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="515" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">channel 0</text>
  <text x="515" y="410" text-anchor="middle" font-size="11" fill="#57606a">Argus</text>
  <text x="515" y="428" text-anchor="middle" font-size="11" fill="#57606a">battery</text>
  <rect x="580" y="360" width="110" height="90" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="635" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">channel 1</text>
  <text x="635" y="410" text-anchor="middle" font-size="11" fill="#57606a">doorbell</text>
  <text x="635" y="428" text-anchor="middle" font-size="11" fill="#57606a">battery</text>
  <rect x="700" y="360" width="110" height="90" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="755" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#24292f">channel 2</text>
  <text x="755" y="410" text-anchor="middle" font-size="11" fill="#57606a">E1 Outdoor</text>
  <text x="755" y="428" text-anchor="middle" font-size="11" fill="#57606a">PTZ</text>

  <!-- integration -> wired camera: HTTP -->
  <line x1="430" y1="150" x2="270" y2="298" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="318" y="214" text-anchor="middle" font-size="11" fill="#57606a" transform="rotate(-42 318 214)">HTTP API</text>
  <!-- wired camera -> integration: ONVIF push -->
  <line x1="300" y1="300" x2="455" y2="152" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="412" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#1a7f37" transform="rotate(-44 412 246)">ONVIF events</text>
  <!-- Gladys -> wired camera: RTSP -->
  <line x1="150" y1="150" x2="150" y2="298" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-purple)"/>
  <text x="160" y="270" font-size="11" fill="#8250df">RTSP live</text>
  <!-- integration -> hub: HTTP per channel -->
  <line x1="560" y1="150" x2="635" y2="288" stroke="#57606a" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="660" y="232" font-size="11" fill="#57606a">HTTP API, per channel,</text>
  <text x="660" y="248" font-size="11" fill="#57606a">sleeping cameras left alone</text>

  <!-- footer -->
  <text x="440" y="492" text-anchor="middle" font-size="11" fill="#57606a">Discovery: Gladys broadcasts on UDP port 2000 on the integration's behalf; addresses can also be entered by hand.</text>
</svg>
