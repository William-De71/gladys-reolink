# -----------------------------------------------------------------------------
# Continuous integration: the quality gate.
#
#   1. Prettier, ESLint and the tests (`node --test`), on Node 22 (the oldest
#      version `engines` accepts) and Node 24 (the one the image ships with);
#   2. the store admission checks (`integration-store`), without the image
#      check: the image of an unreleased version does not exist yet;
#   3. the Docker build (amd64 only, never pushed), so a broken Dockerfile
#      shows up here rather than in a release.
#
# Runs on every pull request and every push to another branch than main. On
# main, the Release workflow calls it (workflow_call): no green CI, no
# release, and no second run of the same checks.
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_call:

# Checks only read the code.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Lint & test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

  store:
    runs-on: ubuntu-latest
    name: Store admission checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate the manifest, the cover and the docs
        run: npx --yes github:GladysAssistant/integration-store . --skip-image-check

  docker:
    runs-on: ubuntu-latest
    name: Docker build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
