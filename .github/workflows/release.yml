# -----------------------------------------------------------------------------
# Automatic release, on every push to main.
#
#   1. ci        the quality gate (ci.yml): no green CI, no release;
#   2. plan      the version, from the Conventional Commits since the last tag
#                (.github/scripts/release.mjs): `feat` -> minor, `fix` / `perf`
#                -> patch, `!` or `BREAKING CHANGE` -> major (minor below
#                1.0.0). `docs`, `chore`, `ci`, `test`, `style`, `refactor`,
#                `build` alone release nothing and the run stops here;
#   3. build     the multi-arch image `:X.Y.Z` + `:latest` (build.yml);
#   4. verify    the image is pullable without authentication (amd64 and
#                arm64), the store validator passes WITH its image check, the
#                repository carries the store topic;
#   5. publish   the release commit `chore(release): X.Y.Z` (manifest,
#                package.json, lockfile, CHANGELOG.md) and the `vX.Y.Z` tag,
#                pushed together (--atomic);
#   6. github-release  the GitHub Release, its notes = the CHANGELOG section.
#
# Order matters: the manifest on main (what the store indexes) announces a
# version only once its image exists, otherwise the store could drop the
# integration or never offer the update.
#
# Manual run (Actions -> Release -> Run workflow): `release-as` forces a
# version (e.g. 1.0.0), `dry-run` only prints the version and the notes in the
# job summary, publishing nothing.
#
# The release commit is pushed with GITHUB_TOKEN, which triggers no workflow:
# it cannot start another release (the `if` below guards it anyway). A
# protected main rejects that push: allow GitHub Actions to bypass the rule
# (ruleset bypass list), or push through a GitHub App token — never a PAT.
# -----------------------------------------------------------------------------
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-as:
        description: 'Force this version (x.y.z), e.g. 1.0.0. Empty: from the commits'
        required: false
        default: ''
        type: string
      dry-run:
        description: 'Only show the version and the notes, publish nothing'
        required: false
        default: false
        type: boolean

# One release at a time, never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  ci:
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every tag and commit, to read the history
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Compute the next version
        id: plan
        env:
          RELEASE_AS: ${{ inputs.release-as }}
        run: node .github/scripts/release.mjs plan --release-as "$RELEASE_AS"

      - name: Summary
        env:
          RELEASE: ${{ steps.plan.outputs.release }}
          VERSION: ${{ steps.plan.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          {
            if [ "$RELEASE" != "true" ]; then
              echo "## No release"
              echo ""
              echo "No \`feat\`, \`fix\`, \`perf\` or breaking commit since the last tag (current version: ${VERSION})."
            else
              # Render the changelog on a throw-away copy, to show the notes.
              node .github/scripts/release.mjs changelog "$VERSION" "$REPO_URL"
              if [ "$DRY_RUN" = "true" ]; then
                echo "## Dry run: version ${VERSION} (nothing published)"
              else
                echo "## Releasing version ${VERSION}"
              fi
              echo ""
              node .github/scripts/release.mjs notes "$VERSION" < CHANGELOG.md
              git checkout -- CHANGELOG.md 2>/dev/null || rm -f CHANGELOG.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' && inputs.dry-run != true
    uses: ./.github/workflows/build.yml
    secrets: inherit # the optional Docker Hub credentials (see build.yml)
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.plan.outputs.version }}
      ref: ${{ github.sha }}

  verify:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: The image is pullable without authentication (amd64 and arm64)
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY,,}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token)"
          if ! index="$(curl -fsS -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}")"; then
            echo "::error::ghcr.io/${repo}:${VERSION} cannot be pulled anonymously. Gladys pulls without credentials: make the package public (GitHub -> Packages -> ${repo#*/} -> Package settings -> Change visibility -> Public), then re-run this job."
            exit 1
          fi
          platforms="$(jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' <<<"$index")"
          echo "$platforms"
          for platform in linux/amd64 linux/arm64; do
            if ! grep -qx "$platform" <<<"$platforms"; then
              echo "::error::ghcr.io/${repo}:${VERSION} has no ${platform} image."
              exit 1
            fi
          done

      - name: The store validator passes, image check included
        run: |
          set -euo pipefail
          node .github/scripts/release.mjs bump "$VERSION" "ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          npx --yes github:GladysAssistant/integration-store .

      - name: The repository carries the store topic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}" --jq '.topics[]' | grep -qx gladys-assistant-integration; then
            echo "::error::The repository lacks the gladys-assistant-integration topic: the store will not index it (Settings -> About -> Topics)."
            exit 1
          fi

  publish:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release commit and its tag
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Bump the version and write the changelog
        run: |
          set -euo pipefail
          node .github/scripts/release.mjs bump "$VERSION" "ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          node .github/scripts/release.mjs changelog "$VERSION" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      # Commit and tag pushed in ONE atomic push: both land or neither does.
      # If main moved since this run started, the push is refused (no force):
      # the run queued for that newer push releases everything.
      - name: Commit, tag and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json gladys-assistant-integration.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/v${VERSION}"

  github-release:
    needs: publish
    uses: ./.github/workflows/github-release.yml
    permissions:
      contents: write
