# -----------------------------------------------------------------------------
# Build & publish the multi-architecture image (linux/amd64 + linux/arm64) to
# the GitHub Container Registry.
#
# Triggers:
#   - called by the Release workflow (workflow_call) with the version it is
#     releasing: the manifest and package.json inside the image are bumped to
#     it first, then `:<version>` and `:latest` are pushed;
#   - a `vX.Y.Z` tag pushed by hand -> release build of that tag;
#   - a manual run (workflow_dispatch) on any branch -> test build, tagged
#     with the branch name (or `image-tag`), never `latest`.
# -----------------------------------------------------------------------------
name: Build and publish image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Image tag to publish (defaults to the branch name)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version:
        description: 'Released version, e.g. 1.2.0 (publishes :<version> + :latest)'
        required: true
        type: string
      ref:
        description: 'Commit to build (the release commit is created afterwards)'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Secrets cannot be tested in an `if`: expose the user name instead.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Never the runner's cached Node: it can predate a security release.
          check-latest: true

      - name: Derive image tags
        id: meta
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image-tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # A release build is told by the `version` input, not the event name:
          # inside a called workflow, GITHUB_EVENT_NAME is the caller's event.
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            tags="${image}:${version},${image}:latest"
            release=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_IMAGE_TAG:-${GITHUB_REF_NAME//\//-}}"
            if [ "$version" = "latest" ]; then
              echo "::error::Cannot use 'latest' as a manual image tag."
              exit 1
            fi
            tags="${image}:${version}"
            release=false
          else
            version="${GITHUB_REF_NAME#v}"
            tags="${image}:${version},${image}:latest"
            release=true
          fi
          if [ "$release" = "true" ]; then
            # The files inside the image announce the version being released
            # (a no-op on a hand-pushed tag, already bumped).
            node .github/scripts/release.mjs bump "$version" "${image}:${version}"
          fi
          # The manifest as an image label, with `docker_image` pointing at the
          # tag being pushed: a dev install (by image) re-reads it on update.
          # Compacted: a label value cannot span several lines.
          manifest="$(jq -c --arg image "${image}:${version}" '.docker_image = $image' \
            gladys-assistant-integration.json)"
          {
            echo "version=${version}"
            echo "image_ref=${image}:${version}"
            echo "tags=${tags}"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"

      # QEMU and the base image come from Docker Hub, whose anonymous pulls
      # from the shared runners can hit its rate limit. Optional credentials:
      # the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (read-only) secrets.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            io.gladysassistant.manifest=${{ steps.meta.outputs.manifest }}

      - name: Docker build summary
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          manifest=$(jq --arg image "$IMAGE_REF" '.docker_image = $image' \
            gladys-assistant-integration.json)
          {
            echo "## Docker build summary"
            echo ""
            echo "Image pushed (linux/amd64 + linux/arm64): \`${IMAGE_REF}\`"
            echo ""
            echo "### Test this build in Gladys"
            echo ""
            echo "In Gladys, open **Integrations → Install an integration → Developer mode** and paste:"
            echo ""
            echo '```json'
            echo "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
