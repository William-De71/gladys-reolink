name: Feature request
description: An idea for the integration
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: The use case first (a scene, a widget, a device value…), then the solution you imagine.
    validations:
      required: true
  - type: input
    id: gladys
    attributes:
      label: Gladys version
